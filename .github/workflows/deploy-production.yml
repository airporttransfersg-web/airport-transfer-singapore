name: Deploy production site

on:
  workflow_dispatch:
    inputs:
      indexchex_url_limit:
        description: "Set to 1 for a one-URL test, or leave at 0 for all new URLs."
        required: false
        default: "0"
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/deploy-production.yml
      - scripts/submit-indexchex.mjs
      - INDEXCHEX-SETUP.md
  schedule:
    # GitHub cron is UTC. 00:10 UTC is 08:10 in Singapore (GMT+8).
    - cron: "10 0 * * *"

concurrency:
  group: airport-transfer-singapore-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build released production pages
        env:
          SITE_ENV: production
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Verify production SEO directives
        env:
          SITE_ENV: production
        run: node scripts/verify-production-seo.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=airport-transfer-singapore --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check IndexChex configuration
        id: indexchex
        env:
          INDEXCHEX_API_KEY: ${{ secrets.INDEXCHEX_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$INDEXCHEX_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "INDEXCHEX_API_KEY is not configured; IndexChex submission is skipped."
          fi

      - name: Restore IndexChex submission history
        if: steps.indexchex.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: .indexchex-submitted-urls
          key: ats-indexchex-submitted-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ats-indexchex-submitted-

      - name: Submit newly live URLs to IndexChex
        if: steps.indexchex.outputs.configured == 'true'
        env:
          INDEXCHEX_API_KEY: ${{ secrets.INDEXCHEX_API_KEY }}
          INDEXCHEX_SITE_URL: https://airporttransfersingapore.com
          INDEXCHEX_SITEMAP_URL: https://airporttransfersingapore.com/sitemap-index.xml
          INDEXCHEX_LOCAL_SITEMAP: dist/sitemap-index.xml
          INDEXCHEX_URL_LIMIT: ${{ inputs.indexchex_url_limit || '0' }}
        run: node scripts/submit-indexchex.mjs
