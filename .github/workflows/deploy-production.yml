name: Deploy production site

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub cron is UTC. 00:10 UTC is 08:10 in Singapore (GMT+8).
    - cron: "10 0 * * *"

concurrency:
  group: airport-transfer-singapore-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build released production pages
        env:
          SITE_ENV: production
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=airport-transfer-singapore --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

